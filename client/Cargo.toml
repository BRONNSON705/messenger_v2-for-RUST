[package]
name = "my_messenger_client"
version = "0.1.0"
edition = "2021"

[dependencies]
eframe = "0.29"
ewebsock = "0.2"
ehttp = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
rfd = "0.15"
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }